# ─────────────────────────────────────────────────────────────────────────────
# render.yaml — Render Blueprint
# Backend API + Managed PostgreSQL only.
# Frontend is deployed separately on Vercel.
#
# How to deploy:
#   1. Push this repo to GitHub
#   2. render.com → New → Blueprint → connect repo
#   3. After deploy, set in Render dashboard:
#        wildlife-backend → FRONTEND_URL = https://your-app.vercel.app
#   4. Open wildlife-backend Shell tab and run: node scripts/applyExtensions.js
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (Docker) ────────────────────────────────────────────────────────
  - type: web
    name: wildlife-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    # Run migrations before server starts on every deploy
    dockerCommand: sh -c "npx prisma migrate deploy && node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: wildlife-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set manually after Vercel frontend is deployed (no trailing slash)
      # Example: https://wildlife-sanctuary.vercel.app
      - key: FRONTEND_URL
        sync: false

# ── Managed PostgreSQL ────────────────────────────────────────────────────────
databases:
  - name: wildlife-db
    plan: free
    databaseName: wildlife_db
