

# ─────────────────────────────────────────────────────────────────────────────
# Wildlife Sanctuary DBMS — Local Development Stack
#
# Starts: PostgreSQL + Backend API
# Frontend: Run separately with `cd frontend && npm run dev` (hot reload)
#
# Usage:
#   docker compose up --build        # First run (builds backend image)
#   docker compose up                # Subsequent runs
#   docker compose down              # Stop containers
#   docker compose down -v           # Stop + delete DB volume (fresh start)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wildlife_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wildlife_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      # Uses Docker internal hostname 'postgres', not localhost
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wildlife_db?schema=public
      # ⚠️  Change this to a real secret before sharing or deploying
      JWT_SECRET: dev_local_jwt_secret_change_before_deploy
      FRONTEND_URL: http://localhost:5173
    volumes:
      # Mount source for hot reload in development
      - ./backend:/app
      # Prevent the host node_modules from overriding the container's
      - /app/node_modules
    # On startup: run migrations → apply SQL extensions → start dev server
    command: >
      sh -c "npx prisma migrate deploy &&
             node scripts/applyExtensions.js &&
             npm run dev"

volumes:
  postgres_data:
